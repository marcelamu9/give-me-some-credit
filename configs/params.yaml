# Parámetros del proyecto. Rutas relativas a la raíz del repo.
seed: 42
target: SeriousDlqin2yrs

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  external: data/external
  models: models
  reports: reports

data:
  training_file: cs-training.csv

# Supuesto de negocio: costo relativo de un falso negativo (aprobar a quien cae en mora)
# frente a un falso positivo (rechazar a un buen cliente). Ver docs/business_context.md.
costs:
  false_negative: 5
  false_positive: 1

# Fracción de test sobre el total; fracción de valid sobre el resto.
split:
  test_size: 0.2
  valid_size: 0.2

# Política de decisión. review_capacity: fracción de solicitudes que los analistas pueden revisar
# a mano (supuesto de negocio, como el 5:1); define la banda de revisión justo por debajo del
# umbral de rechazo. Las dos listas son los escenarios del análisis de sensibilidad.
decision:
  review_capacity: 0.10
  cost_sensitivity_ratios: [3, 5, 10, 20]   # razones FN:FP
  review_capacity_sensitivity: [0.05, 0.10, 0.20]

# Búsqueda de hiperparámetros: iteraciones de RandomizedSearchCV por modelo y pliegues de CV.
search:
  n_iter: 20
  cv_folds: 5
