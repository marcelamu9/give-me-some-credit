[project]
name = "credit-risk"
version = "0.1.0"
description = "Probabilidad de mora severa (90+ días en 2 años) sobre Give Me Some Credit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.143.3",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.poe.tasks]
_ruff-check = "ruff check ."
_ruff-format-check = "ruff format --check ."
_ruff-format = "ruff format ."
_ruff-fix = "ruff check --fix ."
lint = ["_ruff-check", "_ruff-format-check"]
format = ["_ruff-format", "_ruff-fix"]
test = "pytest"
train = "python -m credit_risk.models.train"
serve = "uvicorn credit_risk.api.main:app --host 127.0.0.1 --port 8000"
check = ["lint", "test"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "poethepoet>=0.48.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
